<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h4 class="card-title mb-0">Edit Subscription</h4>
    <button type="button" class="btn btn-light" (click)="goBack()">
      <i class="ri-arrow-left-line me-1"></i> Back
    </button>
  </div>
  <div class="card-body">
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-md-12 mb-3">
          <label class="form-label d-block" for="lang-select">Language</label>
          <select class="form-select w-auto" id="lang-select" name="lang"
            [ngModel]="selectedLanguage" [ngModelOptions]="{standalone: true}"
            (ngModelChange)="onLanguageChange($event)">
            <option *ngFor="let lang of languages" [value]="lang.code || lang.id">{{ lang.name ||
              lang.language_name }}</option>
          </select>
        </div>
      </div>
      <div class="row">

        <div class="col-md-4 mb-3">
          <label class="form-label">Name <span class="text-danger">*</span></label>
          <input class="form-control" formControlName="name" placeholder="Name">
        </div>

        <div class="col-md-12 mb-3">
          <label class="form-label">Description </label>
          <textarea class="form-control" formControlName="description" placeholder="Description" cols="30"
            rows="3"></textarea>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Plan SKU</label>
          <input class="form-control" formControlName="plan_sku" placeholder="Plan SKU">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Apple Product ID</label>
          <input class="form-control" formControlName="apple_product_id" placeholder="Apple Product ID">
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Google Product ID</label>
          <input class="form-control" formControlName="google_product_id" placeholder="Google Product ID">
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-primary" type="submit" [disabled]="editForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          Update Subscription
        </button>
        <button class="btn btn-info" type="button" *ngIf="selectedLanguage !== 'en'"
          (click)="translateSubscription()" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          Translate
        </button>
      </div>

    </form>
  </div>
</div>

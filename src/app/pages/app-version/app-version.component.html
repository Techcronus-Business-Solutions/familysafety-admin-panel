<app-breadcrumbs [title]="title" [breadcrumbItems]="breadCrumbItems"></app-breadcrumbs>

<div class="card">
  <div class="card-header">
    <h4 class="card-title mb-0">App Version</h4>
  </div>
  <div class="card-body" [class.opacity-50]="loading">
    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
      <h5 class="mb-3">iOS</h5>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Force Update Version <span class="text-danger">*</span></label>
          <input class="form-control" formControlName="iosForceUpdateVersion" placeholder="e.g. 1.0.1">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Force Update Build <span class="text-danger">*</span></label>
          <input class="form-control" type="number" min="0" formControlName="iosForceUpdateBuild"
            placeholder="e.g. 3">
        </div>
      </div>

      <h5 class="mb-3">Android</h5>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Force Update Version <span class="text-danger">*</span></label>
          <input class="form-control" formControlName="androidForceUpdateVersion" placeholder="e.g. 1.2.0">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Force Update Build <span class="text-danger">*</span></label>
          <input class="form-control" type="number" min="0" formControlName="androidForceUpdateBuild"
            placeholder="e.g. 2">
        </div>
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-primary" type="submit" [disabled]="editForm.invalid || saving || loading">
          <span *ngIf="saving" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          Update
        </button>
      </div>
    </form>
  </div>
</div>
